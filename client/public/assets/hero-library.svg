      <circle cx="-36" cy="-10" r="8" fill="#7c2d12" opacity="0.95"/><circle cx="-36" cy="-10" r="2.2" fill="#fef3c7"/>
      <circle cx="-16" cy="-10" r="8" fill="#1e293b" /><path d="M-20 -10 H-12 M-16 -14 V-6" stroke="#fde68a" stroke-width="1.4" stroke-linecap="round"/>
      <circle cx="6" cy="-10" r="8" fill="#8aa899" /><circle cx="6" cy="-10" r="2.8" fill="#fff8e7"/>
      <circle cx="26" cy="-10" r="8" fill="#c9734b" /><path d="M22 -10 L26 -14 L30 -10 L26 -6 Z" fill="#fff8e7" opacity="0.95"/>
      <circle cx="48" cy="-10" r="8" fill="#92400e" /><path d="M44 -10 H52 M48 -14 V-6" stroke="#fef3c7" stroke-width="1.3"/>
    </g>
