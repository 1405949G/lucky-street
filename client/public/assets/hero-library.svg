  <g transform="translate(900 348)"><circle cx="0" cy="0" r="10" fill="#8aa899" stroke="rgba(0,0,0,0.10)" stroke-width="1"/><path d="M-4 -1 L0 -5 L4 -1 L0 3 Z" fill="#fff8e7"/><ellipse cx="3" cy="12" rx="9" ry="3" fill="black" opacity="0.12" filter="url(#b6)"/></g>
  <!-- fog at bottom -->
  <ellipse cx="720" cy="416" rx="620" ry="18" fill="#e2e8f0" opacity="0.05" filter="url(#b12)"/>
