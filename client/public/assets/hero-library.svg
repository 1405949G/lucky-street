    <ellipse cx="0" cy="-14" rx="26" ry="7" fill="#fef3c7" opacity="0.95"/>
    <ellipse cx="0" cy="-12" rx="14" ry="4" fill="#fffbeb" opacity="1"/>
    <!-- glow -->
    <ellipse cx="0" cy="2" rx="34" ry="18" fill="#fde68a" opacity="0.16" filter="url(#b12)"/>
  </g>
  <!-- open parchment / cards on table — center -->
