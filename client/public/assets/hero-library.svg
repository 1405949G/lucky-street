  <path d="M0 296 L1440 296 L1320 420 L120 420 Z" fill="#252a2e"/>
  <g stroke="rgba(255,255,255,0.04)" stroke-width="0.9"><path d="M0 332 H1440"/><path d="M0 368 H1440"/><path d="M0 404 H1440"/></g>
  <!-- table lamp — center, warm pool -->
  <ellipse cx="720" cy="302" rx="220" ry="28" fill="#f59e0b" opacity="0.10" filter="url(#b12)"/>
  <g transform="translate(720 274)">
