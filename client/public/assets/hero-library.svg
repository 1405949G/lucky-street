<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 420" width="1440" height="420" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="libBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="42%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="lamp" cx="50%" cy="22%" r="62%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.95"/>
      <stop offset="18%" stop-color="#fde68a" stop-opacity="0.55"/>
      <stop offset="38%" stop-color="#f59e0b" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bookSpine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a2744"/>
      <stop offset="55%" stop-color="#243656"/>
      <stop offset="100%" stop-color="#1a2744"/>
    </linearGradient>
    <filter id="b12"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="b6"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="1440" height="420" fill="url(#libBg)"/>
  <!-- lamp glow -->
  <ellipse cx="720" cy="38" rx="560" ry="140" fill="url(#lamp)" opacity="1"/>
  <!-- bookshelf — top row -->
  <rect x="0" y="108" width="1440" height="8" rx="2" fill="#0b1220" opacity="0.9"/>
  <rect x="0" y="116" width="1440" height="88" fill="#14233a" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <!-- books -->
  <g>
    <rect x="48" y="124" width="18" height="80" rx="1.5" fill="#7c2d12" stroke="rgba(0,0,0,0.18)" stroke-width="0.7"/>
    <rect x="66" y="124" width="22" height="80" rx="1.5" fill="#9a3412" stroke="rgba(0,0,0,0.18)" stroke-width="0.7"/>
    <rect x="88" y="124" width="16" height="80" rx="1.5" fill="#78350f" />
    <rect x="104" y="124" width="20" height="80" rx="1.5" fill="#451a03" />
    <rect x="124" y="124" width="14" height="80" rx="1.5" fill="#7c2d12" opacity="0.95"/>
    <rect x="138" y="124" width="24" height="80" rx="1.5" fill="#92400e" />
    <rect x="162" y="124" width="18" height="80" rx="1.5" fill="#78350f" opacity="0.9"/>
    <!-- second shelf segment -->
    <rect x="340" y="124" width="16" height="80" rx="1.5" fill="#7c2d12"/>
    <rect x="356" y="124" width="20" height="80" rx="1.5" fill="#9a3412"/>
    <rect x="376" y="124" width="22" height="80" rx="1.5" fill="#78350f"/>
    <rect x="398" y="124" width="18" height="80" rx="1.5" fill="#451a03"/>
    <rect x="416" y="124" width="14" height="80" rx="1.5" fill="#7c2d12"/>
    <rect x="1000" y="124" width="20" height="80" rx="1.5" fill="#78350f"/>
    <rect x="1020" y="124" width="18" height="80" rx="1.5" fill="#7c2d12"/>
    <rect x="1038" y="124" width="22" height="80" rx="1.5" fill="#9a3412"/>
    <rect x="1060" y="124" width="16" height="80" rx="1.5" fill="#92400e"/>
    <rect x="1240" y="124" width="18" height="80" rx="1.5" fill="#451a03"/>
    <rect x="1258" y="124" width="20" height="80" rx="1.5" fill="#7c2d12"/>
    <rect x="1278" y="124" width="16" height="80" rx="1.5" fill="#78350f"/>
