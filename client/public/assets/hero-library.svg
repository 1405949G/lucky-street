    <path d="M-18 32 L-12  -8 L12 -8 L18 32 Z" fill="#1e293b" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <rect x="-14" y="-8" width="28" height="4" rx="1" fill="#334155"/>
    <!-- shade -->
    <path d="M-42 -8 L-32 -28 L32 -28 L42 -8 Z" fill="#121a2a" stroke="rgba(253,230,138,0.18)" stroke-width="1"/>
    <path d="M-32 -28 L32 -28 L28 -32 L-28 -32 Z" fill="#1e293b" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
