    <rect x="-92" y="-26" width="184" height="52" rx="6" fill="#fef3c7" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
    <rect x="-92" y="-26" width="184" height="52" rx="6" fill="none" stroke="rgba(124,45,18,0.12)" stroke-width="1"/>
    <!-- deck -->
    <line x1="-72" y1="4" x2="72" y2="4" stroke="rgba(124,45,18,0.14)" stroke-width="0.8"/>
    <line x1="-72" y1="12" x2="72" y2="12" stroke="rgba(124,45,18,0.10)" stroke-width="0.7"/>
