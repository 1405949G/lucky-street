      <ellipse cx="0" cy="-1" rx="3.2" ry="4.2" fill="#f59e0b" opacity="0.95"/>
      <ellipse cx="0.6" cy="-1.4" rx="1.6" ry="2.2" fill="#fffbeb" opacity="1"/>
    </g>
  </g>
  <!-- Lantern 2 -->
  <g>
    <line x1="430" y1="152" x2="430" y2="202" stroke="#4a3a18" stroke-width="1.2" opacity="0.9"/>
    <ellipse cx="430" cy="224" rx="52" ry="52" fill="url(#lanternGlow)" opacity="1"/>
    <g transform="translate(430 224)">
      <path d="M-15 -16 H15 L12 14 H-12 Z" fill="#1a2a3a" stroke="#fbbf24" stroke-width="1.2"/>
      <rect x="-12" y="-16" width="24" height="3.2" rx="1" fill="#fbbf24"/>
      <rect x="-11" y="14" width="22" height="2.4" rx="1" fill="#fbbf24"/>
      <rect x="-10" y="-12" width="20" height="21" rx="1.4" fill="#fff7d6" opacity="0.98"/>
      <rect x="-7.5" y="-8.5" width="15" height="14" rx="0.8" fill="#fde68a" opacity="0.92"/>
      <ellipse cx="0" cy="-1.5" rx="3.8" ry="4.8" fill="#f59e0b" opacity="0.98"/>
      <ellipse cx="0.7" cy="-2" rx="1.8" ry="2.4" fill="#fffbeb" opacity="1"/>
    </g>
  </g>
  <!-- Lantern 3 center large -->
  <g>
    <line x1="720" y1="118" x2="720" y2="188" stroke="#4a3a18" stroke-width="1.4" opacity="0.95"/>
    <ellipse cx="720" cy="218" rx="68" ry="68" fill="url(#lanternGlow)" opacity="1"/>
    <g transform="translate(720 218)">
      <path d="M-18 -19 H18 L14 16 H-14 Z" fill="#132a3d" stroke="#fbbf24" stroke-width="1.35"/>
      <rect x="-14" y="-19" width="28" height="3.8" rx="1.2" fill="url(#lanternGlow)" stroke="#fbbf24" stroke-width="0.6"/>
      <!-- top cap -->
      <path d="M-10 -19 L-6 -27 H6 L10 -19 Z" fill="#1e3a4f" stroke="#fbbf24" stroke-width="0.9"/>
      <rect x="-7" y="-27" width="14" height="2" rx="1" fill="#fbbf24"/>
      <rect x="-12" y="16" width="24" height="2.8" rx="1" fill="#fbbf24"/>
      <rect x="-12" y="-14" width="24" height="24" rx="1.6" fill="#fff7d6" opacity="1"/>
      <rect x="-9" y="-10" width="18" height="16" rx="1" fill="#fde68a" opacity="0.95"/>
      <!-- inner papers -->
      <line x1="0" y1="-14" x2="0" y2="10" stroke="#f59e0b" stroke-width="0.5" opacity="0.45"/>
      <ellipse cx="0" cy="-2" rx="4.6" ry="5.8" fill="#f59e0b" opacity="1"/>
      <ellipse cx="0.8" cy="-2.6" rx="2.2" ry="3" fill="#fffbeb" opacity="1"/>
      <!-- sparkles -->
      <g fill="#fde68a" opacity="0.95"><circle cx="-9" cy="-6" r="1.1"/><circle cx="9.5" cy="-4" r="0.9"/><circle cx="-8.5" cy="5" r="0.8"/></g>
    </g>
  </g>
  <!-- Lantern 4 -->
  <g>
    <line x1="1010" y1="152" x2="1010" y2="202" stroke="#4a3a18" stroke-width="1.2" opacity="0.9"/>
    <ellipse cx="1010" cy="224" rx="52" ry="52" fill="url(#lanternGlow)" opacity="1"/>
    <g transform="translate(1010 224)">
      <path d="M-15 -16 H15 L12 14 H-12 Z" fill="#1a2a3a" stroke="#fbbf24" stroke-width="1.2"/>
      <rect x="-12" y="-16" width="24" height="3.2" rx="1" fill="#fbbf24"/>
      <rect x="-11" y="14" width="22" height="2.4" rx="1" fill="#fbbf24"/>
      <rect x="-10" y="-12" width="20" height="21" rx="1.4" fill="#fff7d6" opacity="0.98"/>
      <rect x="-7.5" y="-8.5" width="15" height="14" rx="0.8" fill="#fde68a" opacity="0.92"/>
      <ellipse cx="0" cy="-1.5" rx="3.8" ry="4.8" fill="#f59e0b" opacity="0.98"/>
      <ellipse cx="0.7" cy="-2" rx="1.8" ry="2.4" fill="#fffbeb" opacity="1"/>
    </g>
  </g>
  <!-- Lantern 5 right -->
  <g>
    <line x1="1230" y1="168" x2="1230" y2="212" stroke="#4a3a18" stroke-width="1.2" opacity="0.9"/>
    <ellipse cx="1230" cy="232" rx="42" ry="42" fill="url(#lanternGlow)" opacity="0.95"/>
    <g transform="translate(1230 232)">
      <path d="M-13 -14 H13 L10 12 H-10 Z" fill="#1a2a3a" stroke="#fbbf24" stroke-width="1.1"/>
      <rect x="-10" y="-14" width="20" height="3" rx="1" fill="#fbbf24"/>
      <rect x="-9" y="12" width="18" height="2.2" rx="1" fill="#fbbf24"/>
      <rect x="-8" y="-10" width="16" height="18" rx="1.2" fill="#fff7d6" opacity="0.96"/>
      <rect x="-6" y="-7" width="12" height="12" rx="0.6" fill="#fde68a" opacity="0.9"/>
      <ellipse cx="0" cy="-1" rx="3.2" ry="4.2" fill="#f59e0b" opacity="0.95"/>
      <ellipse cx="0.6" cy="-1.4" rx="1.6" ry="2.2" fill="#fffbeb" opacity="1"/>
    </g>
  </g>

  <!-- bottom vignette -->
  <rect y="440" width="1440" height="80" fill="url(#sky)" opacity="0.0"/>
  <path d="M0 520 L1440 520 L1440 462 C 980 476, 460 476, 0 462 Z" fill="#070b14" opacity="0.42"/>

  <!-- subtle veil fog overlay at bottom -->
  <ellipse cx="720" cy="492" rx="560" ry="48" fill="#e2e8f0" opacity="0.045" filter="url(#blur18)"/>
</svg>
