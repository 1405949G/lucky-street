<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 520" width="1440" height="520" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#121416"/>
      <stop offset="48%" stop-color="#1a1d1f"/>
      <stop offset="100%" stop-color="#23272a"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="0%" r="78%">
      <stop offset="0%" stop-color="#f3ecd8" stop-opacity="0.95"/>
      <stop offset="18%" stop-color="#f3ecd8" stop-opacity="0.18"/>
      <stop offset="42%" stop-color="#c9734b" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#121416" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2b1f14"/>
      <stop offset="22%" stop-color="#3d2b1f"/>
      <stop offset="48%" stop-color="#4a3422"/>
      <stop offset="78%" stop-color="#3d2b1f"/>
      <stop offset="100%" stop-color="#2b1f14"/>
    </linearGradient>
    <filter id="blur12"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="blur6"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="1440" height="520" fill="url(#bg)"/>
  <!-- wood table top — perspective -->
  <path d="M0 360 L1440 360 L1440 520 L0 520 Z" fill="url(#wood)" opacity="1"/>
  <!-- wood grain lines -->
  <g stroke="rgba(0,0,0,0.22)" stroke-width="1" fill="none" opacity="1">
    <path d="M0 392 H1440"/><path d="M0 428 H1440" opacity="0.7"/><path d="M0 464 H1440" opacity="0.55"/><path d="M0 498 H1440" opacity="0.4"/>
  </g>
  <g stroke="rgba(255,255,255,0.04)" stroke-width="0.8" fill="none">
    <path d="M220 360 L240 520"/><path d="M460 360 L480 520"/><path d="M720 360 L720 520"/><path d="M980 360 L960 520"/><path d="M1220 360 L1200 520"/>
  </g>
  <!-- overhead lamp glow centered -->
  <ellipse cx="720" cy="8" rx="680" ry="220" fill="url(#lampGlow)" opacity="1"/>
  <!-- soft table glow -->
  <ellipse cx="720" cy="420" rx="420" ry="48" fill="#f3ecd8" opacity="0.07" filter="url(#blur12)"/>
  <ellipse cx="320" cy="432" rx="180" ry="22" fill="#8aa899" opacity="0.06" filter="url(#blur12)"/>
  <ellipse cx="1120" cy="432" rx="180" ry="22" fill="#c9734b" opacity="0.06" filter="url(#blur12)"/>

  <!-- scattered game pieces — top-down view, minimalist -->

  <!-- card stack — sage backs -->
  <g transform="translate(540 382) rotate(-8)">
    <rect x="-34" y="-46" width="68" height="92" rx="6" fill="#1e2326" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <rect x="-34" y="-46" width="68" height="92" rx="6" fill="#8aa899" opacity="1"/>
    <rect x="-34" y="-46" width="68" height="92" rx="6" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
    <!-- card pattern — minimalist dots -->
    <circle cx="0" cy="-18" r="8" fill="#f3ecd8" opacity="0.95"/>
    <circle cx="-10" cy="6" r="3.2" fill="#f3ecd8" opacity="0.85"/><circle cx="0" cy="6" r="3.2" fill="#f3ecd8" opacity="0.85"/><circle cx="10" cy="6" r="3.2" fill="#f3ecd8" opacity="0.85"/>
    <circle cx="-10" cy="18" r="3.2" fill="#f3ecd8" opacity="0.75"/><circle cx="0" cy="18" r="3.2" fill="#f3ecd8" opacity="0.75"/><circle cx="10" cy="18" r="3.2" fill="#f3ecd8" opacity="0.75"/>
    <!-- shadow -->
    <ellipse cx="6" cy="48" rx="32" ry="6" fill="black" opacity="0.18" filter="url(#blur6)"/>
  </g>
  <!-- second card stack — cream -->
  <g transform="translate(680 398) rotate(6)">
    <rect x="-32" y="-44" width="64" height="88" rx="6" fill="#1e2326" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <rect x="-32" y="-44" width="64" height="88" rx="6" fill="#fff8e7"/>
    <rect x="-32" y="-44" width="64" height="88" rx="6" fill="none" stroke="rgba(201,115,75,0.12)" stroke-width="1"/>
    <!-- terracotta meeple icon on card -->
    <path d="M-10  -8 L-6 -14 L0 -16 L6 -14 L10 -8 L6 6 L-6 6 Z" fill="#c9734b" opacity="0.95"/>
    <circle cx="0" cy="-10" r="5.5" fill="#c9734b"/>
    <ellipse cx="5" cy="49" rx="28" ry="5" fill="black" opacity="0.16" filter="url(#blur6)"/>
  </g>
  <!-- third card — terracotta back fanned -->
  <g transform="translate(610 372) rotate(2)">
    <rect x="-30" y="-42" width="60" height="84" rx="6" fill="#c9734b" opacity="0.96" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <rect x="-10" y="-18" width="20" height="20" rx="3" fill="#f3ecd8" opacity="0.95"/>
    <path d="M-6 -12 L0 -6 L6 -12 L6 -4 L0 2 L-6 -4 Z" fill="#8aa899" opacity="0.9"/>
    <ellipse cx="4" cy="46" rx="26" ry="5" fill="black" opacity="0.14" filter="url(#blur6)"/>
  </g>

  <!-- dice — cream with dark pips, 3 dice scattered -->
  <g transform="translate(820 390) rotate(14)">
    <rect x="-22" y="-22" width="44" height="44" rx="6" fill="#fff8e7" stroke="rgba(0,0,0,0.08)" stroke-width="1"/>
    <circle cx="-10" cy="-10" r="3" fill="#23272a"/><circle cx="10" cy="-10" r="3" fill="#23272a"/><circle cx="-10" cy="10" r="3" fill="#23272a"/><circle cx="10" cy="10" r="3" fill="#23272a"/><circle cx="0" cy="0" r="3" fill="#23272a"/>
    <ellipse cx="4" cy="26" rx="18" ry="4" fill="black" opacity="0.15" filter="url(#blur6)"/>
  </g>
  <g transform="translate(880 412) rotate(-12)">
    <rect x="-18" y="-18" width="36" height="36" rx="5" fill="#fff8e7" stroke="rgba(0,0,0,0.08)" stroke-width="1"/>
    <circle cx="0" cy="-8" r="2.6" fill="#23272a"/><circle cx="-8" cy="8" r="2.6" fill="#23272a"/><circle cx="8" cy="8" r="2.6" fill="#23272a"/>
    <ellipse cx="3" cy="22" rx="14" ry="3.5" fill="black" opacity="0.13" filter="url(#blur6)"/>
  </g>
  <g transform="translate(780 432) rotate(6)">
    <rect x="-16" y="-16" width="32" height="32" rx="5" fill="#f3ecd8" stroke="rgba(0,0,0,0.08)" stroke-width="1"/>
    <circle cx="-7" cy="-7" r="2.4" fill="#23272a"/><circle cx="7" cy="-7" r="2.4" fill="#23272a"/><circle cx="0" cy="0" r="2.4" fill="#23272a"/><circle cx="-7" cy="7" r="2.4" fill="#23272a"/><circle cx="7" cy="7" r="2.4" fill="#23272a"/>
    <ellipse cx="3" cy="20" rx="12" ry="3" fill="black" opacity="0.12" filter="url(#blur6)"/>
  </g>

  <!-- meeples — terracotta + sage -->
  <g transform="translate(420 412)">
    <ellipse cx="4" cy="18" rx="18" ry="5" fill="black" opacity="0.16" filter="url(#blur6)"/>
    <path d="M-14 12 L-8 -6 L-5 -10 L0 -12 L5 -10 L8 -6 L14 12 Z" fill="#c9734b" stroke="rgba(0,0,0,0.12)" stroke-width="0.8"/>
    <circle cx="0" cy="-8" r="7" fill="#c9734b" stroke="rgba(0,0,0,0.10)" stroke-width="0.8"/>
    <!-- highlight -->
    <circle cx="-2.5" cy="-10" r="1.6" fill="rgba(255,255,255,0.35)"/>
  </g>
  <g transform="translate(1020 408)">
    <ellipse cx="4" cy="18" rx="18" ry="5" fill="black" opacity="0.16" filter="url(#blur6)"/>
    <path d="M-14 12 L-8 -6 L-5 -10 L0 -12 L5 -10 L8 -6 L14 12 Z" fill="#8aa899" stroke="rgba(0,0,0,0.12)" stroke-width="0.8"/>
    <circle cx="0" cy="-8" r="7" fill="#8aa899" stroke="rgba(0,0,0,0.10)" stroke-width="0.8"/>
    <circle cx="-2.5" cy="-10" r="1.6" fill="rgba(255,255,255,0.32)"/>
  </g>
  <g transform="translate(1060 432)" opacity="0.95">
    <ellipse cx="3" cy="14" rx="14" ry="4" fill="black" opacity="0.14" filter="url(#blur6)"/>
    <path d="M-11 10 L-6 -4 L-3 -7 L0 -9 L3 -7 L6 -4 L11 10 Z" fill="#f3ecd8" stroke="rgba(0,0,0,0.10)" stroke-width="0.7"/>
    <circle cx="0" cy="-6" r="5.5" fill="#f3ecd8" stroke="rgba(0,0,0,0.08)" stroke-width="0.7"/>
  </g>
  <g transform="translate(380 432)" opacity="0.9">
    <ellipse cx="3" cy="12" rx="12" ry="3.5" fill="black" opacity="0.12" filter="url(#blur6)"/>
    <path d="M-10 9 L-5 -3 L-2 -6 L0 -7.5 L2 -6 L5 -3 L10 9 Z" fill="#8aa899" opacity="0.95"/>
    <circle cx="0" cy="-5" r="4.8" fill="#8aa899"/>
  </g>

  <!-- tokens — cream & sage -->
  <g transform="translate(500 432)">
    <ellipse cx="0" cy="5" rx="14" ry="5" fill="black" opacity="0.14" filter="url(#blur6)"/>
    <circle cx="0" cy="0" r="12" fill="#fff8e7" stroke="rgba(0,0,0,0.08)" stroke-width="1"/>
    <circle cx="0" cy="0" r="7.5" fill="none" stroke="#c9734b" stroke-width="1.2" opacity="0.9"/>
    <circle cx="0" cy="0" r="2.2" fill="#c9734b"/>
  </g>
  <g transform="translate(920 432)">
    <ellipse cx="0" cy="5" rx="14" ry="5" fill="black" opacity="0.14" filter="url(#blur6)"/>
    <circle cx="0" cy="0" r="12" fill="#8aa899" stroke="rgba(0,0,0,0.08)" stroke-width="1"/>
    <circle cx="0" cy="0" r="7.5" fill="none" stroke="#f3ecd8" stroke-width="1.2" opacity="0.95"/>
    <path d="M-4 -2 L0 -6 L4 -2 L0 2 Z" fill="#f3ecd8"/>
  </g>
  <g transform="translate(950 452)" opacity="0.9">
    <ellipse cx="0" cy="4" rx="10" ry="3.5" fill="black" opacity="0.12" filter="url(#blur6)"/>
    <circle cx="0" cy="0" r="9" fill="#f3ecd8" stroke="rgba(0,0,0,0.08)" stroke-width="1"/>
    <circle cx="0" cy="0" r="5.5" fill="none" stroke="#8aa899" stroke-width="1" opacity="0.9"/>
  </g>

  <!-- subtle cards shadow underlamp -->
  <g opacity="0.0"><rect x="0" y="0" width="10" height="10"/></g>
</svg>
